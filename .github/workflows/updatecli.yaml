---
name: Updatecli

on:
  # Trigger Updatecli if a new commit land on the main branch
  push:
    branches: [ main ]
  # Manually trigger Updatecli via GitHub UI
  workflow_dispatch:
  # Trigger Updatecli once day by a cronjob
  schedule:
  # * is a special character in YAML, so you have to quote this string
  # Run once a day
  - cron: '0 0 * * *'

permissions:
  contents: "write"
  pull-requests: "write"

jobs:
  updatecli:
    runs-on: "ubuntu-latest"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Updatecli in the runner
      uses: updatecli/updatecli-action@8aa7bec31d6463e47c947f06c6b1df7dba276e07 # v3.11.0

    - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
      id: kubectl

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      id: helm
      with:
        version: '4.3.2'

    - name: Get token
      id: get_token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
      with:
        app-id: ${{ secrets.UPDATECLI_APP_ID }}
        private-key: ${{ secrets.UPDATECLI_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Run Updatecli in apply mode
      run: "updatecli --experimental apply --config ./updatecli/updatecli.d --values updatecli/values.yaml --clean=true"
      env:
        UPDATECLI_GITHUB_TOKEN: '${{ steps.get_token.outputs.token }}'
